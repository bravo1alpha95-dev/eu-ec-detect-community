name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the official checksums file
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${work}"
          cd "${work}"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --retry 3 -O "${base}/${archive}"
          curl --fail --silent --show-error --location --retry 3 -O "${base}/${checksums}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          grep "  ${archive}$" "${checksums}" | sha256sum -c -
          official="$(awk -v f="${archive}" '$2 == f { print $1; exit }' "${checksums}")"
          test "${official}" = "${GITLEAKS_SHA256}"
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history
        run: gitleaks detect --redact --source . --no-banner
